# Set default quant to 1024 and 256 for my UMC404HD

context.properties = {
    default.clock.quantum = 1024
}

node.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*UMC404HD.*" }
            { node.name = "~alsa_output.*hw_U192k.*" }
        ]
        actions = {
            update-props = {
                node.force-quantum = 256
            }
        }
    }
]

