# "Bathtub" target curve: boost bass and treble, reduce mids

context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Bathtub EQ"
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          {
            type = builtin
            name = eq
            label = param_eq
            config = {
              filters = [
                { type = bq_lowshelf  freq = 100  gain =  4.0 q = 0.707 }
                { type = bq_peaking   freq = 1000 gain = -2.0 q = 0.7 }
                { type = bq_highshelf freq = 6000 gain =  3.0 q = 0.707 }
              ]
            }
          }
        ]
        inputs = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "eq:Out 1" "eq:Out 2" ]
      }
      capture.props = {
        node.name = eq.bathtub
        media.class = Audio/Sink
        priority.session = -1
        filter.smart = true
        filter.smart.name = bathtub
        filter.smart.disabled = true
        # Start disconnected until WirePlumber supplies a real target.
        filter.smart.target = { node.name = "audio-policy.unassigned" }
      }
      playback.props = {
        node.name = eq.bathtub.output
        node.passive = true
        node.dont-fallback = true
        node.linger = true
        stream.dont-remix = true
      }
    }
  }
]

