# Harman target curve for headphones

context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Harman-shaped EQ (over-ear)"
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          {
            type = builtin
            name = eq
            label = param_eq
            config = {
              # Approximation of the blue curve in your image.
              # Literal target-shaped EQ, not headphone correction.
              filters = [
                  { type = bq_lowshelf  freq = 97    gain =   5.0 q = 0.71 }
                  { type = bq_peaking   freq = 3260  gain =   9.3 q = 0.99 }
                  { type = bq_peaking   freq = 6210  gain =   2.4 q = 1.14 }
                  { type = bq_highshelf freq = 16000 gain = -23.0 q = 0.875 }
              ]
            }
          }
        ]
        inputs = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "eq:Out 1" "eq:Out 2" ]
      }
      capture.props = {
        node.name = eq.harman
        media.class = Audio/Sink
        priority.session = -1
        filter.smart = true
        filter.smart.name = harman
        filter.smart.disabled = true
        # Start disconnected until WirePlumber supplies a real target.
        filter.smart.target = { node.name = "audio-policy.unassigned" }
      }
      playback.props = {
        node.name = eq.harman.output
        node.passive = true
        node.dont-fallback = true
        node.linger = true
        stream.dont-remix = true
      }
    }
  }
]

