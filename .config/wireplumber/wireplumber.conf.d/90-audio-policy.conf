# Set default EQ profiles and register the WirePlumber Lua policy

audio.policy = {
  default = neutral
  hosts = { homi = bathtub mobi = neutral }
  # Optional exceptions, matched against node.name. First match wins.
  devices = [
    { name = UMC404HD profile = bathtub }
    { name = hw_U192k profile = bathtub }
  ]
}

wireplumber.settings.schema = {
  audio.profile = {
    description = "EQ: auto, neutral, bathtub, harman"
    type = string
    default = auto
  }
  audio.rate = {
    description = "Sample rate: 0 = maximum advertised by the output"
    type = int
    default = 0
    min = 0
    max = 1536000
  }
}

wireplumber.components = [
  {
    # See ~/.local/share/wireplumber/scripts/audio-policy.lua
    name = audio-policy.lua
    type = script/lua
    provides = custom.audio-policy
    requires = [ support.standard-event-source metadata.default metadata.filters ]
  }
]

wireplumber.profiles = {
  main = { custom.audio-policy = required }
}

